apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolidation-api
spec:
  replicas: {{ .Values.consolidationApi.replicas }}
  selector:
    matchLabels:
      app: consolidation-api
  template:
    metadata:
      labels:
        app: consolidation-api
    spec:
      containers:
        - name: consolidation-api
          image: {{ .Values.consolidationApi.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              value: {{ .Values.connectionString | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: consolidation-api
spec:
  selector:
    app: consolidation-api
  ports:
    - port: {{ .Values.consolidationApi.servicePort }}
      targetPort: 8080
